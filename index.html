<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MR Cleaning - Lista de precios</title>
  
  <style>
    body {
      margin: 0;
      background-color: lightblue;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    .contenedor {
      margin-top: 30px;
    }

    .lds-ring {
      display: inline-block;
      position: relative;
      width: 80px;
      height: 80px;
    }

    .lds-ring div {
      box-sizing: border-box;
      display: block;
      position: absolute;
      width: 64px;
      height: 64px;
      margin: 8px;
      border: 8px solid #fff;
      border-radius: 50%;
      animation: lds-ring 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      border-color: #fff transparent transparent transparent;
    }

    .lds-ring div:nth-child(1) {
      animation-delay: -0.45s;
    }

    .lds-ring div:nth-child(2) {
      animation-delay: -0.3s;
    }

    .lds-ring div:nth-child(3) {
      animation-delay: -0.15s;
    }

    @keyframes lds-ring {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    p {
      color: white;
      font-size: 18px;
    }

    a {
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="contenedor">
    <div class="lds-ring">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>

    <p>Cargando lista de precios...</p>

    <p id="respaldo" style="display:none;">
      Si la lista no abre automáticamente,
      <a id="enlacePDF" href="#">presiona aquí</a>.
    </p>
  </div>

  <script>
    const PDF = "./Listadeprecios.pdf";

    // Agrega un parámetro para evitar que el navegador
    // conserve una versión vieja del PDF.
    const PDF_URL = PDF + "?v=" + Date.now();

    // Enlace de respaldo por si el navegador bloquea la redirección.
    document.getElementById("enlacePDF").href = PDF_URL;

    setTimeout(() => {
      document.getElementById("respaldo").style.display = "block";
    }, 3000);

    // Abrir directamente el PDF alojado en GitHub.
    window.location.replace(PDF_URL);
  </script>

</body>
</html>
